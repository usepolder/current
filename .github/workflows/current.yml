# Dogfood: run Current on the small example design system in examples/dogfood.
# PRs get the score comment; pushes to main refresh the badge and history.
name: Current
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Overlapping pushes to the same branch queue instead of racing the
# read-modify-write on .current/history.jsonl.
concurrency:
  group: current-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The bundle is built here rather than committed to the repo. It used to
      # be committed, which meant CI scored every PR with whatever bundle was
      # in the repo instead of the source in the PR — the CO3/CO6 probes and a
      # rubric-fingerprint change both shipped invisibly that way, with the
      # score comment reporting healthy numbers from old code.
      #
      # Node 24 because action.yml declares `using: node24`, so this is the
      # runtime the bundle will actually be executed on.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Build the Action bundle
        run: npm run build:action

      - uses: ./
        with:
          working-directory: examples/dogfood
        env:
          CURRENT_FIGMA_TOKEN: ${{ secrets.CURRENT_FIGMA_TOKEN }}
